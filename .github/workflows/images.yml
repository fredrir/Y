name: Build images
'on':
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  api:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@1f2eecbc81ba184252f9ed85f893fa5eb3b5150a
    with:
      image: ghcr.io/fredrir/y-api
      context: .
      dockerfile: Dockerfile
      test-command: bash .infra-build-recipe/scripts/ci/build-test-target.sh ci/Containerfile api-tests
      recipe: y-api
  web:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@1f2eecbc81ba184252f9ed85f893fa5eb3b5150a
    with:
      image: ghcr.io/fredrir/y-web
      context: .
      dockerfile: Dockerfile
      test-command: bash .infra-build-recipe/scripts/ci/build-test-target.sh ci/Containerfile web-tests
      recipe: y-web
