name: Build images
'on':
  push:
    branches:
    - main
    paths-ignore:
    - "**/*.md"
    - "docs/**"
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  api:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@25cbb5389a5d5df996709e2c5a1b4d1443861172
    with:
      image: ghcr.io/fredrir/y-api
      context: .
      dockerfile: Dockerfile
      recipe: y-api
  web:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@25cbb5389a5d5df996709e2c5a1b4d1443861172
    with:
      image: ghcr.io/fredrir/y-web
      context: .
      dockerfile: Dockerfile
      recipe: y-web
