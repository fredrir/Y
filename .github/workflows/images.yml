name: Build images
'on':
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  api:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@25cbb5389a5d5df996709e2c5a1b4d1443861172
    with:
      image: ghcr.io/fredrir/y-api
      context: .
      dockerfile: Dockerfile
      test-command: infra pipeline image --root .infra-build-recipe --context . --dockerfile ci/Containerfile --target api-tests --check-only --timeout 45m
      recipe: y-api
  web:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@25cbb5389a5d5df996709e2c5a1b4d1443861172
    with:
      image: ghcr.io/fredrir/y-web
      context: .
      dockerfile: Dockerfile
      test-command: infra pipeline image --root .infra-build-recipe --context . --dockerfile ci/Containerfile --target web-tests --check-only --timeout 45m
      recipe: y-web
